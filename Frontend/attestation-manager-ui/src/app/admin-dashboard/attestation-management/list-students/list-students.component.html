<div class="list-students-wrapper">
  <div class="list-students-main-content">
    <div class="content-card">
      <div class="executions-header">
        <h2 class="card-title">Students List</h2>
        <input
          type="text"
          class="form-control search-input"
          placeholder="🔍 Search by name, ID or email"
          [(ngModel)]="searchTerm"
        />
      </div>

      <div class="table-scroll-container">
        <table class="table table-hover executions-table mb-0">
          <thead class="table-header">
            <tr>
              <th style="width: 8%">ID</th>
              <th style="width: 20%">Name</th>
              <th style="width: 25%">Email</th>
              <th style="width: 12.5%">Class</th>
              <th style="width: 12.5%">Student ID</th>
              <th style="width: 10%">Attestations</th>
              <th style="width: 12%" class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let student of filteredStudents">
              <td>{{ student.id }}</td>
              <td class="text-truncate" [title]="student.fullName">{{ student.fullName }}</td>
              <td class="text-truncate" [title]="student.email">{{ student.email }}</td>
              <td class="text-truncate" [title]="student.studentClass">{{ student.studentClass }}</td>
              <td>{{ student.studentId }}</td>
              <td>
                <span [ngClass]="{
                  'attestation-badge': true,
                  'has-attestations': student.attestationsCount > 0,
                  'no-attestations': student.attestationsCount === 0
                }">
                  {{ student.attestationsCount }}
                </span>
              </td>
              <td class="text-end actions-column">
                <i
                  class="bi bi-eye text-primary"
                  title="View"
                  (click)="onView(student)"
                ></i>
                <i
                  class="bi bi-trash text-danger ms-3"
                  title="Delete"
                  (click)="onDelete(student)"
                ></i>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div *ngIf="filteredStudents.length === 0" class="empty-state">
        <div class="empty-state-icon"><i class="bi bi-search"></i></div>
        <div class="empty-state-text">
          <h4>No students found</h4>
          <p>Try a different search term.</p>
        </div>
      </div>
    </div>
  </div>
</div>
